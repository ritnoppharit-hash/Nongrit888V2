<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Russo One',sans-serif;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
position:relative;
transition:.4s;
}

/* ดาว */
.stars{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20px 30px,#fff,transparent),
radial-gradient(2px 2px at 90px 70px,#fff,transparent),
radial-gradient(1px 1px at 150px 50px,#fff,transparent),
radial-gradient(2px 2px at 250px 100px,#fff,transparent);
background-size:300px 300px;
animation:moveStars 60s linear infinite;
opacity:.7;
}

@keyframes moveStars{
from{transform:translateY(0);}
to{transform:translateY(-300px);}
}

/* กล่องหลัก */
.container{
position:relative;
z-index:2;
text-align:center;
width:90%;
max-width:350px;
padding:25px;
border-radius:20px;
backdrop-filter:blur(12px);
background:rgba(0,0,0,.6);
box-shadow:0 0 20px rgba(255,255,255,.1);
}

.profile img{
width:110px;
height:110px;
border-radius:50%;
border:3px solid #fff;
margin-bottom:10px;
box-shadow:0 0 15px rgba(255,255,255,.4);
object-fit:cover;
}

.profile h1{
font-size:22px;
margin-bottom:5px;
}

.profile p{
font-size:14px;
color:#888;
margin-bottom:20px;
font-family:'Kanit',sans-serif;
}

.link{
display:block;
text-decoration:none;
color:white;
padding:12px;
margin:10px 0;
border-radius:12px;
background:rgba(255,255,255,.05);
border:1px solid #fff;
transition:.3s;
}

.link:hover{
background:#fff;
color:#000;
transform:scale(1.05);
box-shadow:0 0 20px #fff;
}

.link:active{
transform:scale(.95);
}

/* Toggle Theme */
.theme-switch{
position:absolute;
top:20px;
right:20px;
z-index:99;
}

.theme-switch input{
display:none;
}

.switch{
width:70px;
height:35px;
background:#222;
border-radius:50px;
position:relative;
cursor:pointer;
transition:.4s;
border:2px solid #fff;
}

.switch::before{
content:"☼";
position:absolute;
width:28px;
height:28px;
background:#fff;
border-radius:50%;
top:1px;
left:2px;
display:flex;
justify-content:center;
align-items:center;
font-size:14px;
transition:.4s;
color:#000;
}

.theme-switch input:checked + .switch{
background:#fff;
}

.theme-switch input:checked + .switch::before{
transform:translateX(34px);
content:"☾";
}

body.light{
background:#fff7f1;
color:#5c4033;
}

body.light .container{
background:rgba(255,245,238,.85);
box-shadow:0 0 20px rgba(255,170,120,.18);
color:#5c4033;
border:1px solid rgba(255,190,150,.35);
}

body.light .profile p{
color:#b07d62;
}

body.light .link{
color:#7a4e35;
border:1px solid rgba(255,180,140,.35);
background:rgba(255,230,215,.55);
}

body.light .link:hover{
background:#ffd6bf;
color:#5c4033;
box-shadow:0 0 15px rgba(255,170,120,.25);
}

body.light .stars{
opacity:.12;
}
</style>
</head>

<body>

<!-- Toggle -->
<label class="theme-switch">
<input type="checkbox" id="toggleTheme">
<div class="switch"></div>
</label>
