<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Russo One',sans-serif;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
position:relative;
}
.stars{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(2px 2px at 20px 30px,#fff,transparent),
radial-gradient(2px 2px at 90px 70px,#fff,transparent),
radial-gradient(1px 1px at 150px 50px,#fff,transparent),
radial-gradient(2px 2px at 250px 100px,#fff,transparent);
background-size:300px 300px;
animation:moveStars 60s linear infinite;
opacity:.7;
}

@keyframes moveStars{
from{transform:translateY(0);}
to{transform:translateY(-300px);}
}

.container{
position:relative;
z-index:2;
text-align:center;
width:90%;
max-width:350px;
padding:25px;
border-radius:20px;
backdrop-filter:blur(12px);
background:rgba(0,0,0,.6);
box-shadow:0 0 20px rgba(255,255,255,.1);
}

.profile img{
width:110px;
height:110px;
border-radius:50%;
border:3px solid #fff;
margin-bottom:10px;
box-shadow:0 0 15px rgba(255,255,255,.4);
object-fit:cover;
}

.profile h1{
font-size:22px;
margin-bottom:5px;
}

.profile p {
    font-size: 14px;
    color: #888;
    margin-bottom: 20px;
    font-family: 'Kanit', sans-serif;
}

@keyframes typing{
from{width:0}
to{width:100%}
}

@keyframes blink{
50%{border-color:transparent}
}

.link{
display:block;
text-decoration:none;
color:white;
padding:12px;
margin:10px 0;
border-radius:12px;
background:rgba(255,255,255,.05);
border:1px solid #fff;
transition:.3s;
}

.link:hover{
background:#fff;
color:#000;
transform:scale(1.05);
box-shadow:0 0 20px #fff;
}

.link:active{
transform:scale(.95);
}
</style>
</head>
<body>

<div class="stars"></div>

<div class="container">

<div class="profile">
